name: Research question or critique
description: Propose a bounded question, method, or counterexample.
body:
  - type: markdown
    attributes:
      value: "Use fictional examples only. Do not include private records or participant identities. For sensitive reports, see SECURITY.md."
  - type: textarea
    id: question
    attributes:
      label: Question or claim to examine
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Concrete fictional example or public evidence
    validations:
      required: true
  - type: textarea
    id: artefact
    attributes:
      label: Proposed artefact and what would count against the approach
    validations:
      required: true
